services:
  - type: web
    name: rvl-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WEB_ORIGINS
        value: https://reyval.web.id,https://www.reyval.web.id
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
