name: Feature Carousel Validation

on:
  push:
    branches:
      - feature-carousel-tiktok-tutorial-20260918
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-carousel-tiktok-tutorial-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check assets/universal-downloader.js
          node --check assets/clarity-route.js
      - name: Python syntax
        run: |
          python -m py_compile backend/carousel_routes.py
          python -m py_compile backend/media_inspector_app.py
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Verify inherited and carousel routes
        working-directory: backend
        run: |
          python - <<'PY'
          import media_inspector_app as appmod
          paths={r.path for r in appmod.app.routes}
          required={
            '/health','/api/info','/api/jobs',
            '/api/social/health','/api/social/info','/api/social/jobs',
            '/api/media/health','/api/media/inspect',
            '/api/carousel/health','/api/carousel/info','/api/carousel/jobs',
          }
          missing=required-paths
          assert not missing, f'missing routes: {sorted(missing)}'
          print('routes ok')
          PY
      - name: Test carousel normalization helpers
        working-directory: backend
        run: |
          python - <<'PY'
          import carousel_routes as c
          assert c._platform_for_url('https://www.tiktok.com/@demo/photo/123')[0]=='tiktok'
          assert c._platform_for_url('https://www.instagram.com/p/ABC123/')[0]=='instagram'
          image=c._instagram_item({'ext':'jpg','url':'https://scontent.cdninstagram.com/a.jpg','thumbnail':'https://scontent.cdninstagram.com/a.jpg'},1)
          assert image['kind']=='image' and image['index']==1
          video=c._instagram_item({'formats':[{'url':'https://scontent.cdninstagram.com/a.mp4','vcodec':'h264','acodec':'aac','height':1080,'ext':'mp4'}]},2)
          assert video['kind']=='video' and video['_url'].endswith('.mp4')
          print('helpers ok')
          PY
