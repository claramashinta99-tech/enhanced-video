name: TikTok Visual Tutorial Validation

on:
  push:
    branches:
      - feature-tiktok-visual-tutorial-20260918

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-tiktok-visual-tutorial-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Validate JS and tutorial markup
        run: |
          node --check assets/clarity-route.js
          python - <<'PY'
          from pathlib import Path
          html=Path('clarity/index.html').read_text()
          js=Path('assets/clarity-route.js').read_text()
          assert html.count('class="upload-guide-step"') == 5
          assert 'id="upload-demo-btn"' in html
          assert 'id="upload-demo-gif"' in html
          assert 'tiktok-upload-demo.gif?v=1' in html
          assert 'clarity-route.js?v=3' in html
          for token in ('key-edge','key-desktop','key-studio','key-upload','key-method'):
              assert token in js
          print('tutorial markup ok')
          PY
      - name: Validate GIF
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/tutorial/tiktok-upload-demo.gif')
          assert p.is_file() and p.stat().st_size > 1000
          im=Image.open(p)
          assert im.format == 'GIF'
          assert im.n_frames == 5, im.n_frames
          assert im.info.get('loop') == 0
          print('gif ok', im.size, im.n_frames, p.stat().st_size)
          PY
      - name: Ensure protected files unchanged
        run: |
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          printf '%s\n' assets/clarity-route.js assets/tutorial/tiktok-upload-demo.gif clarity/index.html | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
