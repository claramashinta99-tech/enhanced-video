name: Build TikTok Tutorial GIF

on:
  push:
    branches:
      - feature-tiktok-visual-tutorial-20260918

permissions:
  contents: write

jobs:
  build-gif:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-tiktok-visual-tutorial-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Generate lightweight tutorial GIF
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          Path('assets/tutorial').mkdir(parents=True, exist_ok=True)
          W,H=270,480
          try:
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',13)
              bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',15)
              small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',10)
              big=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',21)
          except:
              font=bold=small=big=None
          bg=(7,12,25); panel=(19,29,49); line=(53,68,106); white=(245,248,255)
          muted=(170,181,211); pink=(255,72,154); cyan=(86,220,255); purple=(170,140,255); mint=(119,232,193)
          frames=[]
          def rr(d,box,r,fill,outline=None,w=1): d.rounded_rectangle(box,r,fill=fill,outline=outline,width=w)
          def header(d,url):
              d.rectangle((0,0,W,42),fill=panel); d.text((12,14),'‹',font=bold,fill=white)
              rr(d,(35,9,W-36,33),8,(26,40,65),line); d.text((47,14),url,font=small,fill=(215,226,245))
              d.text((W-24,14),'...',font=bold,fill=white)
          def caption(d,n,title,color):
              rr(d,(11,H-73,W-11,H-12),10,(11,18,34),line,2)
              rr(d,(20,H-61,47,H-34),14,(12,21,42),color,2); d.text((29,H-56),str(n),font=bold,fill=color)
              d.text((58,H-58),title,font=bold,fill=white)
          # 1 login
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im); header(d,'tiktok.com')
          d.text((W//2-8,86),'♪',font=big,fill=cyan); d.text((W//2-28,117),'TikTok',font=big,fill=white)
          d.text((W//2-53,151),'Log in untuk melanjutkan',font=small,fill=muted)
          rr(d,(28,190,W-28,232),8,(254,44,85),pink,3); d.text((W//2-18,204),'Log in',font=bold,fill=white)
          rr(d,(28,246,W-28,282),7,(13,22,39),line); d.text((45,258),'G   Continue with Google',font=small,fill=white)
          rr(d,(28,291,W-28,327),7,(13,22,39),line); d.text((45,303),'@   Continue with email',font=small,fill=white)
          d.line((226,176,205,203),fill=pink,width=5); d.polygon([(200,205),(211,203),(205,193)],fill=pink)
          caption(d,1,'Login di Edge',cyan); frames.append(im)
          # 2 desktop
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im); header(d,'tiktok.com')
          rr(d,(28,68,W-28,377),10,(25,35,55),line,2)
          rows=['Tab baru','Riwayat','Unduhan','Situs desktop','Cari di halaman','Pengaturan']
          y=88
          for i,t in enumerate(rows):
              fill=(34,47,73) if i==3 else (25,35,55)
              rr(d,(39,y,W-39,y+39),6,fill,pink if i==3 else None,3 if i==3 else 1)
              d.text((54,y+12),t,font=font,fill=white if i==3 else muted)
              if i==3:
                  rr(d,(W-88,y+11,W-51,y+29),10,(48,137,255))
                  d.ellipse((W-69,y+13,W-53,y+27),fill=(220,236,255))
              y+=44
          d.line((217,207,197,226),fill=pink,width=5); d.polygon([(193,229),(204,226),(198,217)],fill=pink)
          caption(d,2,'Mode Desktop',purple); frames.append(im)
          # 3 studio
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im); header(d,'tiktok.com/studio')
          d.rectangle((0,42,W,79),fill=(248,249,252)); d.text((18,54),'♪ TikTok Studio',font=bold,fill=(15,18,25))
          d.rectangle((0,79,58,H-82),fill=(247,249,253)); d.line((58,79,58,H-82),fill=(225,229,238),width=1)
          for yy,ch in [(112,'⌂'),(156,'▣'),(200,'▥'),(244,'◌')]: d.text((23,yy),ch,font=bold,fill=(72,86,112))
          d.rectangle((59,79,W,H-82),fill=(255,255,255))
          d.text((91,133),'Selamat datang',font=bold,fill=(20,27,40)); d.text((91,155),'di TikTok Studio',font=bold,fill=(20,27,40))
          d.text((91,186),'Kelola konten & upload',font=small,fill=(110,123,148))
          for i,h in enumerate([28,47,70,92]): d.rectangle((103+i*28,290-h,119+i*28,290),fill=purple)
          caption(d,3,'Buka TikTok Studio',cyan); frames.append(im)
          # 4 upload
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im); header(d,'tiktok.com/studio')
          d.rectangle((0,42,W,80),fill=(249,250,252)); d.text((14,55),'♪ TikTok Studio',font=bold,fill=(15,18,25))
          rr(d,(W-101,49,W-14,74),7,(254,44,85),pink,3); d.text((W-90,56),'+ Upload',font=small,fill=white)
          d.rectangle((0,80,W,H-82),fill=(255,255,255)); d.text((23,115),'Kelola konten kamu',font=bold,fill=(20,27,40))
          d.text((23,142),'Upload video dan kelola konten.',font=small,fill=(110,123,148))
          for yy in [194,248,302]: rr(d,(23,yy,W-23,yy+37),5,(238,241,246))
          d.line((220,91,206,67),fill=pink,width=5); d.polygon([(203,63),(214,69),(207,76)],fill=pink)
          caption(d,4,'Klik Upload',pink); frames.append(im)
          # 5 final
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im); header(d,'Upload video')
          d.rectangle((0,42,W,H-82),fill=(255,255,255))
          rr(d,(20,69,108,176),6,(111,103,225)); d.text((48,115),'RVL',font=big,fill=white)
          d.text((121,78),'hasil-tiktok-method.mp4',font=small,fill=(65,79,104))
          d.text((121,112),'Caption',font=small,fill=(30,36,49))
          rr(d,(121,128,W-20,194),5,(249,250,252),(203,210,223)); d.text((130,140),'Proses kecil,',font=small,fill=(60,70,88)); d.text((130,155),'hasil besar.',font=small,fill=(60,70,88))
          d.text((22,226),'Publik',font=font,fill=(25,32,46)); d.text((22,260),'Izinkan komentar',font=font,fill=(25,32,46))
          rr(d,(22,311,W-22,353),8,(254,44,85),pink,3); d.text((W//2-24,324),'Upload',font=bold,fill=white)
          d.line((226,294,207,319),fill=pink,width=5); d.polygon([(204,323),(214,316),(204,313)],fill=pink)
          caption(d,5,'Pilih hasil & Upload',mint); frames.append(im)
          out='assets/tutorial/tiktok-upload-demo.gif'
          frames[0].save(out,save_all=True,append_images=frames[1:],duration=[1450]*5,loop=0,optimize=True,disposal=2)
          print(out,Path(out).stat().st_size)
          PY
      - name: Commit GIF asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tutorial/tiktok-upload-demo.gif
          git commit -m 'Add TikTok upload tutorial GIF [skip ci]'
          git push origin HEAD:feature-tiktok-visual-tutorial-20260918
