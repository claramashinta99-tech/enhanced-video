name: Final Carousel Validation

on:
  push:
    branches:
      - feature-carousel-tiktok-tutorial-20260918

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-carousel-tiktok-tutorial-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax
        run: |
          node --check assets/universal-downloader.js
          node --check assets/clarity-route.js
          python -m py_compile backend/carousel_routes.py backend/media_inspector_app.py
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Route regression check
        working-directory: backend
        run: |
          python - <<'PY'
          import media_inspector_app as appmod
          paths={r.path for r in appmod.app.routes}
          required={'/health','/api/info','/api/jobs','/api/social/health','/api/social/info','/api/social/jobs','/api/media/health','/api/media/inspect','/api/carousel/health','/api/carousel/info','/api/carousel/jobs'}
          assert not (required-paths), sorted(required-paths)
          print('route regression ok')
          PY
      - name: Live TikTok slideshow end-to-end
        working-directory: backend
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import carousel_routes as c
          url='https://www.tiktok.com/t/ZTSdULQgX/'
          info=c.extract_carousel_info(url,'tiktok')
          assert len(info['items'])>=1 and info['has_audio']
          with tempfile.TemporaryDirectory() as d:
              bundle=c._bundle_zip(info,url,d)
              assert Path(bundle).is_file() and Path(bundle).stat().st_size>1024
              print('slideshow e2e ok',len(info['items']),Path(bundle).stat().st_size)
          PY
