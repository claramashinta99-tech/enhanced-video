name: YouTube production diagnostic

on:
  push:
    paths:
      - '.github/workflows/youtube-prod-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY: https://enhanced-video-production.up.railway.app
      RENDER: https://rvl-api.onrender.com
      VIDEO_ID: Xh7I5J8eDQY
    steps:
      - name: Compare backends
        shell: bash
        run: |
          set -u
          echo '=== RAILWAY ==='
          curl -sS --max-time 45 "$RAILWAY/health" || true
          echo
          echo '=== RENDER ==='
          curl -sS --max-time 90 "$RENDER/health" || true
          echo
          echo '=== RENDER INFO ==='
          curl -i -sS --max-time 90 -H 'Content-Type: application/json' -d "{\"url\":\"https://www.youtube.com/watch?v=$VIDEO_ID\"}" "$RENDER/api/info" || true
          echo
      - name: Probe Y2Mate current external route
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          H=(-H 'Accept: */*' -H 'Origin: https://y2mate.gs' -H 'Referer: https://y2mate.gs/' -H "User-Agent: $UA")
          echo '=== AUTH ==='
          AUTH=$(curl -sS --max-time 30 "${H[@]}" "https://eta.etacloud.org/api/v1/auth?_=$(date +%s%3N)" || true)
          echo "$AUTH"
          KEY=$(printf '%s' "$AUTH" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("key", ""))' 2>/dev/null || true)
          [ -n "$KEY" ] || exit 0
          echo '=== INIT ==='
          INIT=$(curl -sS --max-time 30 "${H[@]}" -H "Authorization: Bearer $KEY" "https://eta.etacloud.org/api/v1/init?_=$(date +%s%3N)" || true)
          echo "$INIT"
          CONVERT=$(printf '%s' "$INIT" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("convertURL", ""))' 2>/dev/null || true)
          [ -n "$CONVERT" ] || exit 0
          for F in mp3 mp4; do
            echo "=== CONVERT $F ==="
            OUT=$(curl -sS --max-time 90 "${H[@]}" "${CONVERT}&v=${VIDEO_ID}&f=${F}&_=$(date +%s%3N)" || true)
            echo "$OUT"
          done
