name: YouTube production diagnostic

on:
  push:
    paths:
      - '.github/workflows/youtube-prod-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RENDER: https://rvl-api.onrender.com
      VIDEO: https://www.youtube.com/watch?v=Xh7I5J8eDQY
    steps:
      - name: E2E Render original audio
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -H 'Content-Type: application/json' -d "{\"url\":\"$VIDEO\"}" "$RENDER/api/mp3/info" >/tmp/info.json
          curl -fsS --max-time 90 -H 'Content-Type: application/json' -d "{\"url\":\"$VIDEO\"}" "$RENDER/api/audio/prepare" | tee /tmp/prep.json
          echo
          TOKEN=$(python -c 'import json; print(json.load(open("/tmp/prep.json"))["token"])')
          curl -fsS -L --max-time 90 -r 0-65535 -o /tmp/audio.bin "$RENDER/api/audio/chunked/$TOKEN"
          BYTES=$(wc -c < /tmp/audio.bin)
          echo "original_audio_probe_bytes=$BYTES"
          [ "$BYTES" -gt 10000 ]
