name: YouTube production diagnostic

on:
  push:
    paths:
      - '.github/workflows/youtube-prod-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER: https://rvl-api.onrender.com
      SHORT: https://www.youtube.com/watch?v=n1h8pX1pfOU
    steps:
      - name: Wait for diagnostic backend
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 60); do
            BODY=$(curl -sS --max-time 20 "$RENDER/api/youtube/engine" || true)
            echo "$i $BODY"
            if printf '%s' "$BODY" | grep -q 'web-cookie-test'; then READY=1; break; fi
            sleep 5
          done
          [ "$READY" = 1 ]
      - name: Probe exact Shorts strategies
        shell: bash
        run: |
          set -euo pipefail
          ENC=$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["SHORT"],safe=""))')
          for S in web-cookie-test mweb-cookie-test safari-cookie-test creator-cookie-test music-cookie-test tv-cookie-test ios-cookie-test android-cookie-test default-embedded-cookie; do
            echo "===== $S ====="
            curl -fsS --max-time 45 "$RENDER/api/youtube/selftest/$S?url=$ENC" || true
            echo
          done
