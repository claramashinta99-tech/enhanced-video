name: YouTube production diagnostic

on:
  push:
    paths:
      - '.github/workflows/youtube-prod-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENDER: https://rvl-api.onrender.com
      SHORT: https://www.youtube.com/watch?v=n1h8pX1pfOU
    steps:
      - name: E2E exact Shorts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== INFO ==='
          curl -fsS --max-time 100 -H 'Content-Type: application/json' -d "{\"url\":\"$SHORT\"}" "$RENDER/api/info" | tee /tmp/info.json
          echo
          echo '=== JOB ==='
          curl -fsS --max-time 60 -H 'Content-Type: application/json' -d "{\"url\":\"$SHORT\",\"quality\":\"best\"}" "$RENDER/api/jobs" | tee /tmp/job.json
          echo
          JOB=$(python -c 'import json; print(json.load(open("/tmp/job.json"))["job_id"])')
          READY=0
          for i in $(seq 1 150); do
            BODY=$(curl -fsS --max-time 30 "$RENDER/api/jobs/$JOB")
            echo "shorts $i $BODY"
            STATE=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("state"))' "$BODY")
            if [ "$STATE" = ready ]; then READY=1; break; fi
            [ "$STATE" = error ] && exit 1
            sleep 1
          done
          [ "$READY" = 1 ]
          curl -fsS -L --max-time 90 -r 0-65535 -o /tmp/short.bin "$RENDER/api/jobs/$JOB/file"
          BYTES=$(wc -c < /tmp/short.bin)
          echo "shorts file_probe_bytes=$BYTES"
          [ "$BYTES" -gt 10000 ]
