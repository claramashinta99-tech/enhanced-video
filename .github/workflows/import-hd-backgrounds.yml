name: Import HD Background Sources

on:
  push:
    branches:
      - feature-hd-background-20260918

permissions:
  contents: write

jobs:
  import-backgrounds:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-hd-background-20260918
      - name: Download exact HD background sources
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          curl -fL --retry 3 --retry-delay 2 -A "$UA" -e 'https://4kwallpapers.com/'             'https://4kwallpapers.com/images/wallpapers/lofi-boy-5k-retro-5120x2880-15203.jpg'             -o assets/rvl-bg-desktop-hd.jpg
          curl -fL --retry 3 --retry-delay 2 -A "$UA" -e 'https://4kwallpapers.com/'             'https://4kwallpapers.com/images/wallpapers/lofi-boy-landscape-1080x2160-15195.jpg'             -o assets/rvl-bg-mobile-hd.jpg
          test -s assets/rvl-bg-desktop-hd.jpg
          test -s assets/rvl-bg-mobile-hd.jpg
          file assets/rvl-bg-desktop-hd.jpg
          file assets/rvl-bg-mobile-hd.jpg
      - name: Verify JPEG dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          def jpeg_size(path):
              data=Path(path).read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise SystemExit(f'not jpeg: {path}')
              i=2
              while i < len(data)-9:
                  if data[i] != 0xff:
                      i += 1
                      continue
                  marker=data[i+1]
                  i += 2
                  if marker in (0xd8,0xd9):
                      continue
                  if i+2 > len(data): break
                  ln=struct.unpack('>H',data[i:i+2])[0]
                  if marker in range(0xc0,0xc4):
                      h,w=struct.unpack('>HH',data[i+3:i+7])
                      return w,h
                  i += ln
              raise SystemExit(f'jpeg dimensions not found: {path}')
          d=jpeg_size('assets/rvl-bg-desktop-hd.jpg')
          m=jpeg_size('assets/rvl-bg-mobile-hd.jpg')
          print('desktop',d,'mobile',m)
          assert d[0] >= 3840 and d[1] >= 2160, d
          assert m[0] >= 1080 and m[1] >= 1920, m
          PY
      - name: Commit background assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rvl-bg-desktop-hd.jpg assets/rvl-bg-mobile-hd.jpg
          git commit -m 'Add HD responsive background sources [skip ci]'
          git push origin HEAD:feature-hd-background-20260918
