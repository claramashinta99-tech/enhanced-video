name: Apply BGM continuity fix

on:
  push:
    branches: [bgm-continuity-fix]
    paths:
      - '.github/workflows/apply-bgm-continuity-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch BGM resume and cache bust
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/common.js')
          s=p.read_text(encoding='utf-8')
          new_func=r'''function installSiteBgm(){
            if(document.querySelector('#rvl-site-bgm'))return;
            const audio=document.createElement('audio');
            audio.id='rvl-site-bgm';audio.src='/assets/site-bgm.mp3';audio.preload='auto';audio.loop=true;audio.volume=.16;
            document.body.appendChild(audio);
            const style=document.createElement('style');
            style.textContent='.music-toggle{width:34px;height:34px;border:1px solid var(--line,#292929);border-radius:999px;background:#0e0e0e;color:#f2f2f2;display:grid;place-items:center;cursor:pointer;font-size:14px;line-height:1;transition:.18s ease}.music-toggle:hover{background:#171717;border-color:#444}.music-toggle.off{color:#666}.music-toggle .bars{display:flex;align-items:end;gap:2px;height:12px}.music-toggle .bars i{display:block;width:2px;background:currentColor;border-radius:2px;animation:rvlEq .8s ease-in-out infinite alternate}.music-toggle .bars i:nth-child(1){height:5px;animation-delay:-.4s}.music-toggle .bars i:nth-child(2){height:11px;animation-delay:-.15s}.music-toggle .bars i:nth-child(3){height:7px;animation-delay:-.55s}.music-toggle.off .bars i{animation:none;height:2px}@keyframes rvlEq{from{transform:scaleY(.45)}to{transform:scaleY(1)}}';
            document.head.appendChild(style);
            const btn=document.createElement('button');
            btn.type='button';btn.className='music-toggle';btn.setAttribute('aria-label','Toggle background music');btn.innerHTML='<span class="bars"><i></i><i></i><i></i></span>';
            const navRight=document.querySelector('.nav-right');if(navRight)navRight.insertBefore(btn,navRight.firstChild);

            const STATE_KEY='rvl-bgm-state-v2';
            const pref=localStorage.getItem('rvl-bgm-enabled');
            let enabled=pref!=='0';
            const readState=()=>{
              try{return JSON.parse(sessionStorage.getItem(STATE_KEY)||'{}')||{}}catch{return {}}
            };
            const previous=readState();
            const legacyTime=Number(sessionStorage.getItem('rvl-bgm-time')||0);
            const hasPreviousTime=Number.isFinite(Number(previous.time))||Number.isFinite(legacyTime)&&legacyTime>0;
            const shouldResume=previous.playing===true;
            const syncButton=()=>btn.classList.toggle('off',!enabled);
            syncButton();

            const currentTime=()=>Number.isFinite(audio.currentTime)?audio.currentTime:0;
            const saveState=(playing=!audio.paused)=>{
              const time=currentTime();
              sessionStorage.setItem('rvl-bgm-time',String(time));
              sessionStorage.setItem(STATE_KEY,JSON.stringify({time,stamp:Date.now(),playing:enabled&&playing}));
            };
            const tryPlay=()=>{
              if(!enabled)return Promise.resolve();
              const result=audio.play();
              if(result&&typeof result.then==='function')return result.then(()=>saveState(true)).catch(()=>{});
              saveState(true);return Promise.resolve();
            };
            const restorePosition=()=>{
              if(!audio.duration)return;
              let time=Number(previous.time);
              if(!Number.isFinite(time))time=legacyTime;
              if(!Number.isFinite(time)||time<0)time=0;
              const stamp=Number(previous.stamp)||0;
              if(shouldResume&&stamp>0){
                const elapsed=Math.max(0,Math.min(30,(Date.now()-stamp)/1000));
                time+=elapsed;
              }
              if(hasPreviousTime&&time>0)audio.currentTime=time%audio.duration;
              if(shouldResume)tryPlay();
            };
            if(audio.readyState>=1)restorePosition();
            else audio.addEventListener('loadedmetadata',restorePosition,{once:true});

            const firstGesture=()=>{
              tryPlay();
              window.removeEventListener('pointerdown',firstGesture,true);
              window.removeEventListener('keydown',firstGesture,true);
            };
            window.addEventListener('pointerdown',firstGesture,true);
            window.addEventListener('keydown',firstGesture,true);

            document.addEventListener('click',e=>{
              const a=e.target.closest&&e.target.closest('a[href]');
              if(!a||a.target==='_blank'||a.hasAttribute('download'))return;
              try{
                const u=new URL(a.href,location.href);
                if(u.origin===location.origin)saveState(!audio.paused);
              }catch{}
            },true);
            window.addEventListener('pagehide',()=>saveState(!audio.paused));
            window.addEventListener('beforeunload',()=>saveState(!audio.paused));
            document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState(!audio.paused)});
            window.addEventListener('pageshow',()=>{if(enabled&&shouldResume&&audio.paused)tryPlay()});
            setInterval(()=>saveState(!audio.paused),1000);

            btn.addEventListener('click',e=>{
              e.preventDefault();e.stopPropagation();
              enabled=!enabled;
              localStorage.setItem('rvl-bgm-enabled',enabled?'1':'0');
              syncButton();
              if(enabled)tryPlay();
              else{saveState(false);audio.pause()}
            });
          }'''

          pattern=re.compile(r"function installSiteBgm\(\)\{.*?\n\}\n\nfunction installModernUI\(\)\{",re.S)
          replacement=new_func+'\n\nfunction installModernUI(){'
          out,n=pattern.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit(f'BGM function replacement count={n}')
          p.write_text(out,encoding='utf-8')

          changed=0
          for hp in Path('.').rglob('*.html'):
              text=hp.read_text(encoding='utf-8')
              new=re.sub(r'common\.js\?v=[^"\']+', 'common.js?v=20260917bgm1', text)
              if new!=text:
                  hp.write_text(new,encoding='utf-8')
                  changed+=1
          print('html_cache_bust_files=',changed)
          PY

      - name: Commit patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'claramashinta99-tech'
          git config user.email 'claramashinta99@gmail.com'
          git add assets/common.js '*.html' '**/*.html' || true
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Keep BGM continuous between tools'
          git push origin HEAD:main
