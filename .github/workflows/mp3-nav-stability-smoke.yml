name: MP3 nav stability smoke

on:
  push:
    branches: [mp3-nav-stability-test]
    paths:
      - 'assets/router.js'
      - 'assets/nav-ui.js'
      - 'youtube-mp3/index.html'
      - 'youtube-shorts/index.html'
      - '.github/workflows/mp3-nav-stability-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolation checks
        run: |
          node --check assets/router.js
          node --check assets/nav-ui.js
          node --check assets/mp3.js
          ! grep -q "classList.add('active')" assets/nav-ui.js
          ! grep -q 'nav-ui.js' youtube-mp3/index.html
          ! grep -q 'router.js' youtube-mp3/index.html
          grep -q 'router.js?v=11' youtube-shorts/index.html
          grep -q 'nav-ui.js?v=2' youtube-shorts/index.html
      - name: Add Shorts click probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('youtube-shorts/index.html')
          s=p.read_text()
          probe=r'''<script>
          addEventListener('load',()=>setTimeout(()=>{
            const btn=document.querySelector('.rvl-tools-wrap>.nav-link');
            if(!btn)return;
            btn.click();
            setTimeout(()=>{
              const link=[...document.querySelectorAll('.rvl-tools-panel a')].find(a=>a.getAttribute('href')==='/youtube-mp3/');
              if(link)link.click();
            },150);
          },500));
          </script>'''
          p.write_text(s.replace('</body>',probe+'</body>'))
          PY
      - name: Serve branch
        run: |
          python3 -m http.server 8765 >/tmp/rvl-http.log 2>&1 &
          sleep 1
      - name: Verify Shorts to MP3 native navigation
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --mute-audio --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:8765/youtube-shorts/' > /tmp/from-shorts.html
          grep -q 'YouTube MP3 Downloader' /tmp/from-shorts.html
          grep -q 'class="mp3-tools"' /tmp/from-shorts.html
          grep -q '>Music<' /tmp/from-shorts.html
      - name: Verify MP3 direct load does not hang
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --mute-audio --virtual-time-budget=2500 --dump-dom 'http://127.0.0.1:8765/youtube-mp3/' > /tmp/mp3-direct.html
          grep -q 'YouTube MP3 Downloader' /tmp/mp3-direct.html
          grep -q 'class="mp3-tools"' /tmp/mp3-direct.html
