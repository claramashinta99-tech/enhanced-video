name: Verify Railway production

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: https://enhanced-video-production.up.railway.app
      TIKTOK_URL: https://www.tiktok.com/@bukanpidel1/video/7669610923919363349
    steps:
      - name: Verify deployed backend version
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsS -L --max-time 30 "$API/health")
          echo "$BODY"

      - name: Verify TikTok Normal and HD choices
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 90 \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"$TIKTOK_URL\"}" \
            "$API/api/info" | tee /tmp/tiktok-info.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/tiktok-info.json'))
          choices=x.get('choices') or []
          print({'platform':x.get('platform'),'id':x.get('id'),'choices':choices})
          assert x.get('platform') == 'tiktok'
          assert [c.get('id') for c in choices] == ['best','2160'], choices
          assert choices[0].get('label') == 'Normal'
          assert (choices[1].get('label') or '').startswith('HD')
          PY

      - name: Verify TikTok HD download
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"$TIKTOK_URL\",\"quality\":\"2160\"}" \
            "$API/api/jobs" | tee /tmp/tiktok-job.json
          JOB=$(python -c 'import json; print(json.load(open("/tmp/tiktok-job.json"))["job_id"])')
          READY=0
          for i in $(seq 1 90); do
            BODY=$(curl -fsS -L --max-time 20 "$API/api/jobs/$JOB")
            echo "$BODY"
            STATE=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("state"))' "$BODY")
            if [ "$STATE" = ready ]; then READY=1; break; fi
            [ "$STATE" = error ] && exit 1
            sleep 1
          done
          [ "$READY" = 1 ]
          curl -fsS -L --max-time 60 -r 0-131071 -o /tmp/tiktok-hd.bin "$API/api/jobs/$JOB/file"
          test $(wc -c < /tmp/tiktok-hd.bin) -gt 10000
