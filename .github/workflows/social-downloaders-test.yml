name: Social downloader branch test

on:
  push:
    branches: [feature-social-downloaders-20260918]
    paths:
      - backend/social_downloaders_app.py
      - backend/requirements.txt
      - Dockerfile
      - .github/workflows/social-downloaders-test.yml
  workflow_dispatch:

jobs:
  test-social:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade pip
          python -m pip install -q -r backend/requirements.txt
      - name: Find an anonymous Instagram video with audio
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json, shutil, subprocess, tempfile
          from pathlib import Path
          import social_downloaders_app as s

          urls=[
            'https://instagram.com/p/aye83DjauH/',
            'https://www.instagram.com/reel/CDUMkliABpa/',
            'https://www.instagram.com/marvelskies.fc/reel/CWqAgUZgCku/',
            'https://www.instagram.com/reels/Cop84x6u7CP/',
            'https://www.instagram.com/p/BQ0eAlwhDrw/',
          ]
          winner=None
          for url in urls:
              try:
                  info=s.extract_social_info(url,'instagram')
                  safe=[{k:f.get(k) for k in ('format_id','ext','width','height','vcodec','acodec','format_note')} for f in info.get('formats') or []]
                  probable_audio=any(f.get('acodec')!='none' for f in info.get('formats') or [])
                  print('CANDIDATE',url,'id=',info.get('id'),'probable_audio=',probable_audio,'formats=',json.dumps(safe,ensure_ascii=False))
                  if probable_audio and winner is None:
                      winner=url
              except Exception as exc:
                  print('CANDIDATE_FAIL',url,type(exc).__name__,str(exc)[-300:])
          if not winner:
              raise SystemExit('no anonymous Instagram audio candidate found')
          print('WINNER=',winner)
          work=tempfile.mkdtemp(prefix='rvl-ig-audio-')
          try:
              path=s.download_social_sync(winner,'instagram','best',work)
              size=Path(path).stat().st_size
              streams=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height','-of','json',str(path)],text=True,timeout=30)).get('streams') or []
              print('WINNER_RESULT=',json.dumps({'file':Path(path).name,'bytes':size,'streams':streams},ensure_ascii=False))
              assert any(x.get('codec_type')=='video' for x in streams),streams
              assert any(x.get('codec_type')=='audio' for x in streams),streams
          finally:
              shutil.rmtree(work,ignore_errors=True)
          PY
