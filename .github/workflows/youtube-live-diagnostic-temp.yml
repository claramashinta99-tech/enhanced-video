name: YouTube Live Diagnostic Temp
on:
  push:
    branches: [diag-youtube-live-20260919]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER: https://rvl-api.onrender.com
      NORMAL: https://www.youtube.com/watch?v=9_0Dk2B2zmA
      SHORT_WATCH: https://www.youtube.com/watch?v=toAU_JyPI9M
      FOURK: https://www.youtube.com/watch?v=b8wsjx7dFwM
    steps:
      - name: Render YouTube capability
        run: |
          set +e
          for U in "$NORMAL" "$SHORT_WATCH" "$FOURK"; do
            echo "=== INFO $U ==="
            curl -sS -i --max-time 120 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$RENDER/api/info"
            echo
          done
      - name: Render MP3 source
        run: |
          set +e
          for U in "$NORMAL" "$SHORT_WATCH"; do
            echo "=== AUDIO PREP $U ==="
            curl -sS -i --max-time 120 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$RENDER/api/audio/prepare"
            echo
          done
