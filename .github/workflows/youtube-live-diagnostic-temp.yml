name: YouTube Live Diagnostic Temp
on:
  push:
    branches: [diag-youtube-live-20260919]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://rvl-api.onrender.com
    steps:
      - name: Fresh audio source
        shell: bash
        run: |
          set -euo pipefail
          U='https://www.youtube.com/watch?v=9_0Dk2B2zmA&rvl_audio=fresh20260919'
          echo '=== MP3 INFO ==='
          curl -fsS -L --max-time 60 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$API/api/mp3/info"
          echo
          echo '=== AUDIO PREPARE ==='
          curl -fsS -L --max-time 90 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$API/api/audio/prepare"
          echo
