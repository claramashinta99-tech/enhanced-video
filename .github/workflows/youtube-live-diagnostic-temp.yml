name: YouTube Live Diagnostic Temp
on:
  push:
    branches: [diag-youtube-live-20260919]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Shorts URL shape on authenticated Render
        run: |
          set +e
          API=https://rvl-api.onrender.com
          U=https://www.youtube.com/shorts/9_0Dk2B2zmA
          curl -sS -i --max-time 120 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$API/api/info"
