name: YouTube Live Diagnostic Temp
on:
  push:
    branches: [diag-youtube-live-20260919]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: https://rvl-api.onrender.com
      SHORT: https://www.youtube.com/watch?v=sbZCJrZFJpM
    steps:
      - name: Shorts info
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 90 -H 'Content-Type: application/json' -d "{\"url\":\"$SHORT\"}" "$API/api/info" | tee /tmp/info.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/info.json'))
          assert x.get('platform')=='youtube'
          assert x.get('id')=='sbZCJrZFJpM'
          print(x.get('title'), x.get('max_height'))
          PY
      - name: Shorts best job
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 30 -H 'Content-Type: application/json' -d "{\"url\":\"$SHORT\",\"quality\":\"best\"}" "$API/api/jobs" | tee /tmp/job.json
          JOB=$(python -c 'import json; print(json.load(open("/tmp/job.json"))["job_id"])')
          READY=0
          for i in $(seq 1 120); do
            BODY=$(curl -fsS -L --max-time 20 "$API/api/jobs/$JOB")
            echo "$BODY"
            STATE=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("state"))' "$BODY")
            if [ "$STATE" = ready ]; then READY=1; break; fi
            [ "$STATE" = error ] && exit 1
            sleep 1
          done
          [ "$READY" = 1 ]
          curl -fsS -L --max-time 60 -r 0-65535 -o /tmp/short.bin "$API/api/jobs/$JOB/file"
          test $(wc -c < /tmp/short.bin) -gt 10000
