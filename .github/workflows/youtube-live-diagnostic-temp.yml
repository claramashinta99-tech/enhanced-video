name: YouTube Live Diagnostic Temp
on:
  push:
    branches: [diag-youtube-live-20260919]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY: https://enhanced-video-production.up.railway.app
      RENDER: https://rvl-api.onrender.com
      VIDEO: https://www.youtube.com/watch?v=9_0Dk2B2zmA
      SHORTS: https://www.youtube.com/shorts/toAU_JyPI9M
    steps:
      - name: Compare Railway and Render
        run: |
          set +e
          for API in "$RAILWAY" "$RENDER"; do
            echo "=== API $API HEALTH ==="
            curl -sS -i --max-time 90 "$API/health"
            echo
            for U in "$VIDEO" "$SHORTS"; do
              echo "=== API $API INFO $U ==="
              curl -sS -i --max-time 120 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$API/api/info"
              echo
              echo "=== API $API MP3 INFO $U ==="
              curl -sS -i --max-time 120 -H 'Content-Type: application/json' -d "{\"url\":\"$U\"}" "$API/api/mp3/info"
              echo
            done
          done
