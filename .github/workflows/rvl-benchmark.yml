name: RVL downloader benchmark

on:
  push:
    branches: [benchmark-rvl]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_URL: 'https://www.youtube.com/watch?v=9_0Dk2B2zmA'
      API: 'https://rvl-api.onrender.com'
    steps:
      - name: Confirm live backend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$API/health" | tee /tmp/health.json
          grep -q '"version":"1.13.1"' /tmp/health.json

      - name: Prepare one audio token with retries
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({'url': os.environ['VIDEO_URL']}))
          PY
          )
          echo '--- info ---'
          curl -sS --max-time 45 -o /tmp/info.json \
            -w 'info http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n' \
            -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/mp3/info"
          cat /tmp/info.json; echo

          : > /tmp/prepare.json
          for i in 1 2 3; do
            echo "--- prepare attempt $i ---"
            CODE=$(curl -sS --max-time 35 -o /tmp/prepare.json \
              -w '%{http_code}' -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/audio/prepare" || true)
            echo "http=$CODE body=$(cat /tmp/prepare.json)"
            TOKEN=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/prepare.json')).get('token',''))
          except: print('')
          PY
            )
            if [ -n "$TOKEN" ]; then echo "$TOKEN" > /tmp/token; exit 0; fi
            sleep 4
            curl -sS --max-time 45 -o /dev/null -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/mp3/info" || true
          done
          echo 'prepare never returned token' >&2
          exit 1

      - name: Inspect token and compare direct CDN vs Render proxy
        continue-on-error: true
        shell: bash
        run: |
          set -u
          TOKEN=$(cat /tmp/token)
          echo '--- source debug ---'
          curl -sS --max-time 20 "$API/api/audio/debug/$TOKEN"; echo

          echo '--- DIRECT CDN (cross-IP test) ---'
          curl -sS -L --max-time 90 -o /dev/null \
            -w 'direct http=%{http_code} redirects=%{num_redirects} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} speed_Bps=%{speed_download}\n' \
            "$API/api/audio/direct/$TOKEN"
          echo "direct_exit=$?"

          echo '--- Render proxy first 1 MiB ---'
          curl -sS -L --max-time 90 -H 'Range: bytes=0-1048575' -o /dev/null \
            -w 'proxy1m http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} speed_Bps=%{speed_download}\n' \
            "$API/api/audio/chunked/$TOKEN"
          echo "proxy1m_exit=$?"

          echo '--- Render proxy full file ---'
          curl -sS -L --max-time 90 -o /dev/null \
            -w 'proxyfull http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} speed_Bps=%{speed_download}\n' \
            "$API/api/audio/chunked/$TOKEN"
          echo "proxyfull_exit=$?"

      - name: Compare direct yt-dlp on fresh machine
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python -m pip install -q -U 'yt-dlp[default,curl-cffi]'
          yt-dlp --version
          echo '--- yt-dlp metadata ---'
          /usr/bin/time -f 'metadata elapsed=%e sec' timeout 90 yt-dlp --no-warnings --skip-download --print '%(title)s | %(duration)s sec' "$VIDEO_URL"
          echo "metadata_exit=$?"
          echo '--- yt-dlp native audio download, 4 MiB chunks ---'
          rm -f /tmp/rvl-direct.*
          /usr/bin/time -f 'direct-download elapsed=%e sec' timeout 180 yt-dlp --no-warnings --http-chunk-size 4M -f 'bestaudio[ext=m4a]/bestaudio' -o '/tmp/rvl-direct.%(ext)s' "$VIDEO_URL"
          echo "ytdlp_download_exit=$?"
          ls -lh /tmp/rvl-direct.* 2>/dev/null || true

      - name: Benchmark MP3 conversion for at most 120 seconds
        continue-on-error: true
        shell: bash
        run: |
          set -u
          PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({'url': os.environ['VIDEO_URL'], 'quality':'audio'}))
          PY
          )
          START=$(date +%s)
          curl -sS --max-time 45 -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/mp3/jobs" -o /tmp/job.json
          cat /tmp/job.json; echo
          JOB=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/job.json')).get('job_id',''))
          except: print('')
          PY
          )
          test -n "$JOB" || exit 0
          for i in $(seq 1 60); do
            BODY=$(curl -sS --max-time 20 "$API/api/jobs/$JOB" || true)
            NOW=$(date +%s)
            echo "t=$((NOW-START))s $BODY"
            STATE=$(python -c 'import sys,json; x=sys.stdin.read();
          try: print(json.loads(x).get("state",""))
          except: print("")' <<<"$BODY")
            [ "$STATE" = ready ] && exit 0
            [ "$STATE" = error ] && exit 0
            sleep 2
          done
          echo 'MP3 still not ready after ~120 sec'
