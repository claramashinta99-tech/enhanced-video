name: RVL live MP3 smoke test

on:
  push:
    branches: [benchmark-rvl]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VIDEO_URL: 'https://www.youtube.com/watch?v=9_0Dk2B2zmA'
      SITE: 'https://reyval.web.id/youtube-mp3/'
      API: 'https://rvl-api.onrender.com'
    steps:
      - name: Wake backend
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            curl -sS --max-time 35 "$API/health" && break
            sleep 3
          done
          exit 0

      - name: Run live Chrome flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rvl-live && cd /tmp/rvl-live
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          cat > run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const site=process.env.SITE;
          const video=process.env.VIDEO_URL;
          const t0=Date.now();
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--enable-features=WebAssemblySimd'],acceptDownloads:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',String(e)));
          await page.goto(site,{waitUntil:'domcontentloaded',timeout:60000});
          const src=await page.getAttribute('script[src*="mp3.js"]','src');
          console.log('mp3_script='+src);
          if(!src?.includes('v=4')) throw new Error('Live page is not on mp3.js v4 yet');
          await page.fill('#media-url',video);
          const tCheck=Date.now();
          await page.click('#inspect-btn');
          await page.waitForSelector('#media-card.show',{timeout:60000});
          console.log('check_ms='+(Date.now()-tCheck));
          const selected=await page.inputValue('#audio-mode');
          console.log('selected_mode='+selected);
          if(selected!=='mp3') throw new Error('MP3 is not selected by default');
          const tDownload=Date.now();
          const downloadPromise=page.waitForEvent('download',{timeout:120000});
          await page.click('#download-btn');
          const download=await downloadPromise;
          const path=await download.path();
          const name=download.suggestedFilename();
          console.log('download_name='+name);
          console.log('download_ms='+(Date.now()-tDownload));
          console.log('total_ms='+(Date.now()-t0));
          if(!name.toLowerCase().endsWith('.mp3')) throw new Error('Downloaded file is not MP3');
          if(!path) throw new Error('Download has no file path');
          await browser.close();
          JS
          CHROME="$CHROME" SITE="$SITE" VIDEO_URL="$VIDEO_URL" timeout 240 node run.mjs
