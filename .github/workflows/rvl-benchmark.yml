name: RVL downloader benchmark

on:
  push:
    branches: [benchmark-rvl]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_URL: 'https://www.youtube.com/watch?v=9_0Dk2B2zmA'
      API: 'https://rvl-api.onrender.com'
    steps:
      - name: Confirm live backend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$API/health" | tee /tmp/health.json
          grep -q '"version":"1.13.1"' /tmp/health.json

      - name: Prepare and download source audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rvlbench
          PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({'url': os.environ['VIDEO_URL']}))
          PY
          )
          curl -sS --max-time 45 -o /tmp/info.json -w 'info http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n' -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/mp3/info"
          cat /tmp/info.json; echo
          TOKEN=''
          for i in 1 2 3; do
            CODE=$(curl -sS --max-time 35 -o /tmp/prepare.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/audio/prepare" || true)
            echo "prepare[$i] http=$CODE $(cat /tmp/prepare.json)"
            TOKEN=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/prepare.json')).get('token',''))
          except: print('')
          PY
            )
            [ -n "$TOKEN" ] && break
            sleep 3
          done
          test -n "$TOKEN"
          echo "$TOKEN" >/tmp/token
          curl -sS -L --max-time 60 -o /tmp/rvlbench/input.m4a -w 'tunnel http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} speed_Bps=%{speed_download}\n' "$API/api/audio/chunked/$TOKEN"
          ls -lh /tmp/rvlbench/input.m4a
          test $(stat -c%s /tmp/rvlbench/input.m4a) -gt 9000000

      - name: Benchmark Mediabunny LAME SIMD in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rvlbench
          npm init -y >/dev/null 2>&1
          npm install --silent mediabunny @mediabunny/mp3-encoder esbuild playwright-core
          cat > app.js <<'JS'
          import {
            Input, ALL_FORMATS, BlobSource, Output, BufferTarget,
            Mp3OutputFormat, canEncodeAudio, Conversion
          } from 'mediabunny';
          import { registerMp3Encoder } from '@mediabunny/mp3-encoder';

          const log=(x)=>console.log('RVLBENCH '+x);
          const done=(obj)=>{
            const s=JSON.stringify(obj);
            document.body.dataset.done='1';
            document.body.dataset.result=s;
            log(s);
          };

          try {
            const t0=performance.now();
            if (!(await canEncodeAudio('mp3'))) registerMp3Encoder();
            const tRegister=performance.now();
            const r=await fetch('/input.m4a');
            const sourceBlob=await r.blob();
            const file=new File([sourceBlob], 'input.m4a', {type: sourceBlob.type || 'audio/mp4'});
            const tFetch=performance.now();
            const input=new Input({source:new BlobSource(file), formats:ALL_FORMATS});
            const target=new BufferTarget();
            const output=new Output({format:new Mp3OutputFormat(), target});
            const conversion=await Conversion.init({input, output, audio:{bitrate:192000}});
            const tInit=performance.now();
            await conversion.execute();
            const tDone=performance.now();
            const buffer=target.buffer;
            done({
              ok:!!buffer,
              inputBytes:file.size,
              outputBytes:buffer?.byteLength || 0,
              registerMs:Math.round(tRegister-t0),
              fetchMs:Math.round(tFetch-tRegister),
              initMs:Math.round(tInit-tFetch),
              encodeMs:Math.round(tDone-tInit),
              totalMs:Math.round(tDone-t0)
            });
          } catch(e) {
            done({error:String(e), stack:e?.stack||''});
          }
          JS
          npx esbuild app.js --bundle --format=esm --platform=browser --target=chrome120 --outfile=bundle.js
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>RVL Mediabunny bench</title><body><script type="module" src="/bundle.js"></script></body>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          echo "chrome=$CHROME"
          test -n "$CHROME"
          cat > run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--enable-features=WebAssemblySimd']});
          const page=await browser.newPage();
          page.on('console',m=>console.log(m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR '+e));
          await page.goto('http://127.0.0.1:8765',{waitUntil:'load'});
          await page.waitForFunction(()=>document.body.dataset.done==='1',null,{timeout:240000});
          const result=await page.getAttribute('body','data-result');
          console.log('RESULT '+result);
          const parsed=JSON.parse(result);
          if (parsed.error || !parsed.ok || parsed.outputBytes < 10000000) process.exitCode=1;
          await browser.close();
          JS
          CHROME="$CHROME" timeout 300 node run.mjs
