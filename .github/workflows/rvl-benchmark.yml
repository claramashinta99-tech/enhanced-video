name: RVL downloader benchmark

on:
  push:
    branches: [benchmark-rvl]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_URL: 'https://www.youtube.com/watch?v=9_0Dk2B2zmA'
      API: 'https://rvl-api.onrender.com'
    steps:
      - name: Wake backend
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            curl -sS --max-time 35 "$API/health" && break
            sleep 3
          done
          exit 0

      - name: Prepare and download source audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rvlbench
          PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({'url': os.environ['VIDEO_URL']}))
          PY
          )
          curl -sS --max-time 60 -o /tmp/info.json -w 'info http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n' -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/mp3/info"
          cat /tmp/info.json; echo
          TOKEN=''
          for i in 1 2 3; do
            CODE=$(curl -sS --max-time 45 -o /tmp/prepare.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/api/audio/prepare" || true)
            echo "prepare[$i] http=$CODE $(cat /tmp/prepare.json)"
            TOKEN=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/prepare.json')).get('token',''))
          except: print('')
          PY
            )
            [ -n "$TOKEN" ] && break
            sleep 3
          done
          test -n "$TOKEN"
          echo "$TOKEN" >/tmp/token
          curl -sS -L --max-time 60 -o /tmp/rvlbench/input.m4a -w 'tunnel http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} speed_Bps=%{speed_download}\n' "$API/api/audio/chunked/$TOKEN"
          test $(stat -c%s /tmp/rvlbench/input.m4a) -gt 9000000

      - name: Benchmark production CDN engine in Chrome
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rvlbench
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>RVL CDN bench</title><body><script type="module">
          const done=(obj)=>{const s=JSON.stringify(obj);document.body.dataset.done='1';document.body.dataset.result=s;console.log('RVLBENCH '+s)};
          try {
            const t0=performance.now();
            const mb=await import('https://esm.sh/mediabunny@1.56.3');
            const ext=await import('https://esm.sh/@mediabunny/mp3-encoder@1.56.3');
            const tImport=performance.now();
            if (!(await mb.canEncodeAudio('mp3'))) ext.registerMp3Encoder();
            const r=await fetch('/input.m4a');
            const sourceBlob=await r.blob();
            const file=new File([sourceBlob],'input.m4a',{type:sourceBlob.type||'audio/mp4'});
            const tFetch=performance.now();
            const input=new mb.Input({source:new mb.BlobSource(file),formats:mb.ALL_FORMATS});
            const target=new mb.BufferTarget();
            const output=new mb.Output({format:new mb.Mp3OutputFormat(),target});
            const conversion=await mb.Conversion.init({input,output,audio:{bitrate:192000}});
            const tInit=performance.now();
            await conversion.execute();
            const tDone=performance.now();
            done({ok:!!target.buffer,inputBytes:file.size,outputBytes:target.buffer?.byteLength||0,importMs:Math.round(tImport-t0),fetchMs:Math.round(tFetch-tImport),initMs:Math.round(tInit-tFetch),encodeMs:Math.round(tDone-tInit),totalMs:Math.round(tDone-t0)});
          } catch(e) {done({error:String(e),stack:e?.stack||''});}
          </script></body>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          cat > run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--enable-features=WebAssemblySimd']});
          const page=await browser.newPage();
          page.on('console',m=>console.log(m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR '+e));
          await page.goto('http://127.0.0.1:8765',{waitUntil:'load'});
          await page.waitForFunction(()=>document.body.dataset.done==='1',null,{timeout:240000});
          const result=await page.getAttribute('body','data-result');
          console.log('RESULT '+result);
          const parsed=JSON.parse(result);
          if(parsed.error||!parsed.ok||parsed.outputBytes<10000000)process.exitCode=1;
          await browser.close();
          JS
          CHROME="$CHROME" timeout 300 node run.mjs
