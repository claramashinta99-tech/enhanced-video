name: Tools click smoke

on:
  push:
    branches: [tools-click-fix-test]
    paths:
      - 'assets/router.js'
      - '.github/workflows/tools-click-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check assets/router.js
      - name: Add click probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('clarity/index.html')
          s=p.read_text()
          probe=r'''<script>
          window.addEventListener('rvl:route',()=>setTimeout(()=>{
            document.body.dataset.testPath=location.pathname;
            document.body.dataset.testLabel=document.querySelector('.rvl-tools-wrap>.nav-link')?.textContent||'';
          },250));
          window.addEventListener('load',()=>setTimeout(()=>{
            const target=new URLSearchParams(location.search).get('target');
            const btn=document.querySelector('.rvl-tools-wrap>.nav-link');
            if(!target||!btn)return;
            btn.click();
            setTimeout(()=>{
              const link=[...document.querySelectorAll('.rvl-tools-panel a')].find(a=>a.getAttribute('href')===target);
              if(link)link.click();
            },120);
          },500));
          </script>'''
          p.write_text(s.replace('</body>',probe+'</body>'))
          PY
      - name: Serve branch
        run: |
          python3 -m http.server 8765 >/tmp/rvl-tools-click-http.log 2>&1 &
          sleep 1
      - name: Click every Tools item
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          for target in clarity tiktok-downloader youtube-downloader youtube-shorts; do
            timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --mute-audio --virtual-time-budget=3200 --dump-dom "http://127.0.0.1:8765/clarity/?target=/${target}/" > "/tmp/${target}.html"
            grep -q "data-test-path=\"/${target}/\"" "/tmp/${target}.html"
            grep -q 'data-test-label="Tools"' "/tmp/${target}.html"
          done
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --mute-audio --virtual-time-budget=3200 --dump-dom 'http://127.0.0.1:8765/clarity/?target=/youtube-mp3/' > /tmp/mp3.html
          grep -q 'YouTube MP3 Downloader' /tmp/mp3.html
