name: RVL Pixel and Shorts test

on:
  push:
    branches: [pixel-shorts-v1]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/pixel.js
          node --check assets/shorts.js
          node --check assets/downloader.js
          node --check assets/router.js
          node --check assets/home.js
          python3 -m py_compile backend/shorts_app.py
          grep -q "'/youtube-shorts/'" assets/router.js
          grep -q 'youtube-shorts/' index.html
          for f in index.html clarity/index.html tiktok-downloader/index.html youtube-downloader/index.html youtube-shorts/index.html youtube-mp3/index.html; do
            grep -q 'pixel.js' "$f"
          done

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rvltest
          cd /tmp/rvltest
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          cat > run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const chrome=process.env.CHROME;
          const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--enable-features=WebAssemblySimd']});
          const page=await browser.newPage();
          const base='http://127.0.0.1:8765';
          const routes=['/','/clarity/','/tiktok-downloader/','/youtube-downloader/','/youtube-shorts/','/youtube-mp3/'];
          for(const route of routes){
            await page.goto(base+route,{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#rvl-pixel-bg',{timeout:10000});
            if(!(await page.$('#rvl-pixel-style')))throw new Error('pixel style missing on '+route);
            if(!(await page.$('.brand')))throw new Error('brand missing on '+route);
          }

          await page.goto(base+'/',{waitUntil:'domcontentloaded'});
          const cards=await page.locator('.home-tool-card').count();
          if(cards!==5)throw new Error('expected 5 tools, got '+cards);
          if(!(await page.locator('a[href="./youtube-shorts/"]').count()))throw new Error('Shorts homepage link missing');

          let infoBody=null,jobBody=null,apiCalls=0;
          await page.route('https://rvl-api.onrender.com/**',async route=>{
            apiCalls++;
            const req=route.request();const u=new URL(req.url());
            if(u.pathname==='/api/info'){
              infoBody=JSON.parse(req.postData()||'{}');
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({platform:'youtube',title:'Pixel Short',thumbnail:'',uploader:'RVL Test',duration:31,max_height:1080,choices:[{id:'1080',label:'1080p'},{id:'720',label:'720p'}]})});
            }
            if(u.pathname==='/api/jobs'&&req.method()==='POST'){
              jobBody=JSON.parse(req.postData()||'{}');
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({job_id:'job-short',state:'queued',progress:2})});
            }
            if(u.pathname==='/api/jobs/job-short')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({job_id:'job-short',state:'ready',progress:100,stage:'Siap',filename:'short.mp4',error:null})});
            if(u.pathname==='/api/jobs/job-short/file')return route.fulfill({status:200,headers:{'Content-Type':'video/mp4','Content-Disposition':'attachment; filename="short.mp4"'},body:'fakevideo'});
            return route.fulfill({status:404,body:'not mocked'});
          });

          await page.goto(base+'/youtube-shorts/',{waitUntil:'domcontentloaded'});
          await page.fill('#media-url','https://www.youtube.com/shorts/BAIr4ChC3po?si=test');
          await page.click('#inspect-btn');
          await page.waitForSelector('#media-card.show');
          const canonical='https://www.youtube.com/watch?v=BAIr4ChC3po';
          if(infoBody?.url!==canonical)throw new Error('Shorts info was not canonical: '+JSON.stringify(infoBody));
          await page.click('#download-btn');
          await page.waitForFunction(()=>document.querySelector('#rvl-job-stage')?.textContent==='Selesai',null,{timeout:10000});
          if(jobBody?.url!==canonical)throw new Error('Shorts job was not canonical: '+JSON.stringify(jobBody));

          apiCalls=0;
          await page.goto(base+'/youtube-downloader/',{waitUntil:'domcontentloaded'});
          await page.fill('#media-url','https://www.youtube.com/shorts/BAIr4ChC3po');
          await page.click('#inspect-btn');
          await page.waitForTimeout(250);
          const msg=await page.textContent('#download-status');
          if(!/Shorts/i.test(msg||''))throw new Error('regular YouTube tool did not redirect Shorts intent');
          if(apiCalls!==0)throw new Error('regular YouTube tool called API for a Shorts URL');

          await browser.close();
          console.log('Browser smoke passed');
          JS
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rvl-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" timeout 180 node /tmp/rvltest/run.mjs
