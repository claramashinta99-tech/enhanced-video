name: UI nav smoke

on:
  push:
    branches: [ui-nav-controls-test]
    paths:
      - 'assets/nav-ui.js'
      - 'index.html'
      - 'clarity/index.html'
      - 'tiktok-downloader/index.html'
      - 'youtube-downloader/index.html'
      - 'youtube-shorts/index.html'
      - 'youtube-mp3/index.html'
      - '.github/workflows/ui-nav-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check assets/nav-ui.js
      - name: Serve branch
        run: |
          python3 -m http.server 8765 > /tmp/rvl-ui-http.log 2>&1 &
          echo $! > /tmp/rvl-ui-http.pid
          sleep 1
      - name: Open all pages in Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          pages=("" "clarity/" "tiktok-downloader/" "youtube-downloader/" "youtube-shorts/" "youtube-mp3/")
          for page in "${pages[@]}"; do
            slug="${page//\//-}"; slug="${slug:-home}"
            url="http://127.0.0.1:8765/${page}"
            echo "Testing $url"
            timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --mute-audio --virtual-time-budget=1800 --dump-dom "$url" > "/tmp/${slug}.html"
            grep -q '>Music<' "/tmp/${slug}.html"
            grep -q '>Tools<' "/tmp/${slug}.html"
            grep -q 'rvl-tools-panel' "/tmp/${slug}.html"
            grep -q 'TikTok Method' "/tmp/${slug}.html"
            grep -q 'TikTok Downloader' "/tmp/${slug}.html"
            grep -q 'YouTube Video' "/tmp/${slug}.html"
            grep -q 'YouTube Shorts' "/tmp/${slug}.html"
            grep -q 'YouTube MP3' "/tmp/${slug}.html"
            test "$(wc -c < "/tmp/${slug}.html")" -gt 500
          done
      - name: Verify MP3 stays isolated
        run: |
          ! grep -q 'assets/common.js' youtube-mp3/index.html
          ! grep -q 'assets/pixel.js' youtube-mp3/index.html
          ! grep -q 'assets/router.js' youtube-mp3/index.html
          grep -q 'assets/mp3.js?v=12' youtube-mp3/index.html
          grep -q 'assets/nav-ui.js?v=1' youtube-mp3/index.html
