name: RVL YouTube engine validation

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import new engine
        working-directory: backend
        run: |
          python - <<'PY'
          import youtube_engine_app as eng
          from importlib.metadata import version
          print('APP_VERSION', eng.legacy.APP_VERSION)
          print('YT_DLP', version('yt-dlp'))
          print('ATTEMPTS', [x['name'] for x in eng.youtube_attempts()])
          assert eng.legacy.APP_VERSION == '1.15.0'
          assert 'visionos-web-public' in [x['name'] for x in eng.youtube_attempts()]
          PY
