name: RVL backend compare smoke

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RAILWAY: https://enhanced-video-production.up.railway.app
      RENDER: https://rvl-api.onrender.com
      TIKTOK_URL: https://www.tiktok.com/@audreyvale_/video/7680281253311958294
    steps:
      - name: Health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 30 "$RAILWAY/health" >/tmp/railway-health.json
          curl -fsS -L --max-time 90 "$RENDER/health" >/tmp/render-health.json

      - name: TikTok Railway end-to-end
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 60 -H 'Content-Type: application/json' -d "{\"url\":\"$TIKTOK_URL\"}" "$RAILWAY/api/info" | tee /tmp/r-info.json
          curl -fsS -L --max-time 30 -H 'Content-Type: application/json' -d "{\"url\":\"$TIKTOK_URL\",\"quality\":\"best\"}" "$RAILWAY/api/jobs" | tee /tmp/r-job.json
          JOB=$(python -c 'import json; print(json.load(open("/tmp/r-job.json"))["job_id"])')
          READY=0
          for i in $(seq 1 90); do
            BODY=$(curl -fsS -L --max-time 20 "$RAILWAY/api/jobs/$JOB")
            STATE=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("state"))' "$BODY")
            echo "$BODY"
            if [ "$STATE" = ready ]; then READY=1; break; fi
            [ "$STATE" = error ] && exit 1
            sleep 1
          done
          [ "$READY" = 1 ]
          curl -fsS -L --max-time 60 -r 0-131071 -o /tmp/r-tiktok.bin "$RAILWAY/api/jobs/$JOB/file"
          echo "railway_bytes=$(wc -c < /tmp/r-tiktok.bin)"
          test $(wc -c < /tmp/r-tiktok.bin) -gt 10000

      - name: TikTok Render end-to-end
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 60 -H 'Content-Type: application/json' -d "{\"url\":\"$TIKTOK_URL\"}" "$RENDER/api/info" | tee /tmp/d-info.json
          curl -fsS -L --max-time 30 -H 'Content-Type: application/json' -d "{\"url\":\"$TIKTOK_URL\",\"quality\":\"best\"}" "$RENDER/api/jobs" | tee /tmp/d-job.json
          JOB=$(python -c 'import json; print(json.load(open("/tmp/d-job.json"))["job_id"])')
          READY=0
          for i in $(seq 1 90); do
            BODY=$(curl -fsS -L --max-time 20 "$RENDER/api/jobs/$JOB")
            STATE=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("state"))' "$BODY")
            echo "$BODY"
            if [ "$STATE" = ready ]; then READY=1; break; fi
            [ "$STATE" = error ] && exit 1
            sleep 1
          done
          [ "$READY" = 1 ]
          curl -fsS -L --max-time 60 -r 0-131071 -o /tmp/d-tiktok.bin "$RENDER/api/jobs/$JOB/file"
          echo "render_bytes=$(wc -c < /tmp/d-tiktok.bin)"
          test $(wc -c < /tmp/d-tiktok.bin) -gt 10000
