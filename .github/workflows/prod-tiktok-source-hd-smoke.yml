name: TikTok source HD production smoke

on:
  push:
    branches: [main]
    paths:
      - 'backend/tiktok_hd_app.py'
      - 'Dockerfile'
      - '.github/workflows/prod-tiktok-source-hd-smoke.yml'
  workflow_dispatch:

jobs:
  tiktok-source-hd:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RAILWAY: https://enhanced-video-production.up.railway.app
      TIKTOK_URL: https://www.tiktok.com/@azzorml13/video/7682277583664336136
      TIKTOK_ID: '7682277583664336136'
    steps:
      - name: Wait for Railway v1.17.0
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            BODY=$(curl -fsS -L --max-time 30 "$RAILWAY/health" || true)
            echo "$BODY"
            VER=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("version",""))' "$BODY" 2>/dev/null || true)
            [ "$VER" = "1.17.0" ] && exit 0
            sleep 6
          done
          exit 1

      - name: Verify Normal and HD choices
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 90 \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"$TIKTOK_URL\"}" \
            "$RAILWAY/api/info" | tee /tmp/tiktok-info.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/tiktok-info.json'))
          print({k:x.get(k) for k in ['platform','id','title','duration','choices']})
          assert x.get('platform') == 'tiktok'
          assert str(x.get('id')) == os.environ['TIKTOK_ID']
          choices=x.get('choices') or []
          assert [c.get('id') for c in choices] == ['best','2160'], choices
          assert choices[0].get('label') == 'Normal'
          assert (choices[1].get('label') or '').startswith('HD')
          PY

      - name: Download Normal and HD
        shell: bash
        run: |
          set -euo pipefail
          download_mode() {
            local QUALITY="$1"
            local OUT="$2"
            curl -fsS -L --max-time 30 \
              -H 'Content-Type: application/json' \
              -d "{\"url\":\"$TIKTOK_URL\",\"quality\":\"$QUALITY\"}" \
              "$RAILWAY/api/jobs" > "/tmp/job-$QUALITY.json"
            JOB=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["job_id"])' "/tmp/job-$QUALITY.json")
            READY=0
            for i in $(seq 1 150); do
              BODY=$(curl -fsS -L --max-time 20 "$RAILWAY/api/jobs/$JOB")
              echo "$QUALITY $BODY"
              STATE=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("state"))' "$BODY")
              if [ "$STATE" = ready ]; then READY=1; break; fi
              [ "$STATE" = error ] && exit 1
              sleep 1
            done
            [ "$READY" = 1 ]
            curl -fsS -L --max-time 180 -o "$OUT" "$RAILWAY/api/jobs/$JOB/file"
          }
          download_mode best /tmp/normal.mp4
          download_mode 2160 /tmp/hd.mp4

          echo '--- file sizes ---'
          wc -c /tmp/normal.mp4 /tmp/hd.mp4
          echo '--- sha256 ---'
          sha256sum /tmp/normal.mp4 /tmp/hd.mp4

          NORMAL_SHA=$(sha256sum /tmp/normal.mp4 | awk '{print $1}')
          HD_SHA=$(sha256sum /tmp/hd.mp4 | awk '{print $1}')
          [ "$NORMAL_SHA" != "$HD_SHA" ]

          NORMAL_BYTES=$(wc -c < /tmp/normal.mp4)
          HD_BYTES=$(wc -c < /tmp/hd.mp4)
          test "$NORMAL_BYTES" -gt 10000
          test "$HD_BYTES" -gt 10000
          echo "normal_bytes=$NORMAL_BYTES"
          echo "hd_bytes=$HD_BYTES"

      - name: Probe outputs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          echo '--- NORMAL ---'
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,avg_frame_rate,bit_rate \
            -show_entries format=duration,size,bit_rate \
            -of default=nw=1 /tmp/normal.mp4
          echo '--- HD ---'
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,avg_frame_rate,bit_rate \
            -show_entries format=duration,size,bit_rate \
            -of default=nw=1 /tmp/hd.mp4
