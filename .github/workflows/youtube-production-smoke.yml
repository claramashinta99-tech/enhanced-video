name: RVL production Shorts smoke

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHORT_ID: Xh7I5J8eDQY
      ORIGIN: https://reyval.web.id
    steps:
      - name: Probe CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -i --max-time 20 -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            'https://youtubei.googleapis.com/youtubei/v1/player?prettyPrint=false' | tee /tmp/options.txt

      - name: Call Innertube as VISIONOS from independent egress
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/body.json <<JSON
          {"context":{"client":{"clientName":"VISIONOS","clientVersion":"1.02","deviceMake":"Apple","deviceModel":"RealityDevice17,1","userAgent":"Mozilla/5.0 (Macintosh; Intel Mac OS X 15_7_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Safari/605.1.15","osName":"visionOS","osVersion":"26.5.23O471","hl":"en","gl":"US"}},"videoId":"$SHORT_ID","contentCheckOk":true,"racyCheckOk":true}
          JSON
          code=$(curl -sS --max-time 20 -D /tmp/player.headers -o /tmp/player.json -w '%{http_code}' \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json \
            'https://youtubei.googleapis.com/youtubei/v1/player?prettyPrint=false' || true)
          echo "http=$code bytes=$(wc -c < /tmp/player.json)"
          cat /tmp/player.headers
          python - <<'PY'
          import json
          x=json.load(open('/tmp/player.json'))
          p=x.get('playabilityStatus') or {}
          sd=x.get('streamingData') or {}
          fs=(sd.get('formats') or [])+(sd.get('adaptiveFormats') or [])
          print('playability=',p.get('status'),p.get('reason'))
          print('formats=',len(fs))
          print('with_url=',sum(1 for f in fs if f.get('url')))
          print('heights=',sorted({f.get('height') for f in fs if f.get('height')}))
          print('samples=',[(f.get('itag'),f.get('height'),f.get('mimeType'),bool(f.get('url')),bool(f.get('signatureCipher'))) for f in fs[:12]])
          if p.get('status')!='OK' or not any(f.get('url') for f in fs): raise SystemExit(2)
          PY
