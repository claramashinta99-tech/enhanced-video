name: RVL production Shorts smoke

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: https://rvl-api.onrender.com
    steps:
      - name: Wait for backend v1.15.6
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            BODY=$(curl -fsS --max-time 25 "$API/health" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"1.15.6"'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Test alternate Innertube hosts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 35 "$API/api/youtube/nettest"; echo
          names=(visionos-studio-skip visionos-music-skip visionos-mobile-skip visionos-nocookie-skip visionos-googleapis-skip)
          for name in "${names[@]}"; do
            echo "=== $name ==="
            curl -sS --max-time 35 "$API/api/youtube/selftest/$name" | tee "/tmp/$name.json"
            echo
            sleep 1
          done
          python - <<'PY'
          import json, pathlib
          names=['visionos-studio-skip','visionos-music-skip','visionos-mobile-skip','visionos-nocookie-skip','visionos-googleapis-skip']
          rows=[]
          for name in names:
              try: rows.append(json.loads((pathlib.Path('/tmp')/f'{name}.json').read_text()))
              except Exception: pass
          print('RESULTS',[(x.get('strategy'),x.get('ok'),x.get('seconds'),x.get('formats'),x.get('max_height'),x.get('error')) for x in rows])
          ok=[x for x in rows if x.get('ok')]
          if not ok: raise SystemExit('No alternate Innertube host succeeded')
          PY
