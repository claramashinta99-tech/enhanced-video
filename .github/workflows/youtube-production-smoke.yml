name: RVL production Shorts smoke

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://rvl-api.onrender.com
    steps:
      - name: Wait for backend v1.15.3
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            BODY=$(curl -fsS --max-time 25 "$API/health" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"1.15.3"'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Probe network layer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$API/api/youtube/nettest" | tee /tmp/nettest.json
          echo
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nettest.json'))
          print('NETTEST', x)
          PY
