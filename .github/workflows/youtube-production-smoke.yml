name: RVL production Shorts smoke

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      API: https://rvl-api.onrender.com
    steps:
      - name: Wait for backend v1.15.2
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            BODY=$(curl -fsS --max-time 25 "$API/health" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"1.15.2"'; then exit 0; fi
            sleep 10
          done
          echo 'backend did not reach v1.15.2 in time' >&2
          exit 1

      - name: Probe all YouTube strategies on Render
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 "$API/api/youtube/engine"; echo
          names=(mweb-pot-public default-public embedded-public android-vr-public default-embedded-cookie safari-cookie)
          pids=()
          for name in "${names[@]}"; do
            (
              curl -sS --max-time 20 "$API/api/youtube/selftest/$name" > "/tmp/$name.json" || true
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid" || true; done
          for name in "${names[@]}"; do
            echo "=== $name ==="
            cat "/tmp/$name.json" || true
            echo
          done
          python - <<'PY'
          import json, pathlib
          rows=[]
          for p in pathlib.Path('/tmp').glob('*.json'):
              try:
                  x=json.loads(p.read_text())
              except Exception:
                  continue
              if 'strategy' in x:
                  rows.append(x)
          ok=[x for x in rows if x.get('ok')]
          print('SUCCESSFUL', [(x.get('strategy'), x.get('seconds'), x.get('formats'), x.get('max_height')) for x in ok])
          if not ok:
              raise SystemExit('No YouTube strategy succeeded from Render')
          PY
