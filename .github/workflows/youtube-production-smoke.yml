name: RVL production Shorts smoke

on:
  push:
    branches: [youtube-engine-nightly-v1]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SHORT_ID: sJtC8WP9nSI
    steps:
      - name: Check screenshot Short directly from GitHub egress
        shell: bash
        run: |
          set -u
          WATCH="https://www.youtube.com/watch?v=$SHORT_ID"
          OEMBED="https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D$SHORT_ID&format=json"
          echo '=== oEmbed ==='
          curl -sS -L --max-time 20 -D /tmp/oembed.headers -o /tmp/oembed.body -w 'http=%{http_code} total=%{time_total}\n' "$OEMBED" || true
          cat /tmp/oembed.headers || true
          head -c 2000 /tmp/oembed.body || true; echo
          echo '=== watch page ==='
          curl -sS -L --max-time 20 -A 'Mozilla/5.0' -D /tmp/watch.headers -o /tmp/watch.body -w 'http=%{http_code} total=%{time_total}\n' "$WATCH" || true
          head -n 15 /tmp/watch.headers || true
          echo "watch_bytes=$(wc -c < /tmp/watch.body 2>/dev/null || echo 0)"

      - name: Run current yt-dlp on screenshot Short from GitHub egress
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'yt-dlp[default] @ https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.08.30.232658/yt-dlp.tar.gz'
          START=$(date +%s)
          set +e
          timeout 45s python -m yt_dlp --no-config-locations --no-playlist --skip-download --dump-single-json --no-warnings "https://www.youtube.com/watch?v=$SHORT_ID" >/tmp/info.json 2>/tmp/err.txt
          CODE=$?
          set -e
          echo "exit=$CODE seconds=$(($(date +%s)-START))"
          cat /tmp/err.txt || true
          if [ -s /tmp/info.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('/tmp/info.json'))
          print('ID',x.get('id'),'TITLE',x.get('title'),'FORMATS',len(x.get('formats') or []))
          print('MAX_HEIGHT',max([int(f.get('height') or 0) for f in (x.get('formats') or [])] or [0]))
          PY
          fi
