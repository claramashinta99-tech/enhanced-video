name: TikTok source probe

on:
  push:
    branches: [main]
    paths:
      - backend/tiktok_engine_app.py
      - .github/workflows/tiktok-source-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ffmpeg and backend dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r backend/requirements.txt
      - name: Probe TikDownloader.io Ultra HD candidates
        working-directory: backend
        env:
          TEST_URL: https://www.tiktok.com/@azzorml13/video/7682277583664336136?is_from_webapp=1&sender_device=pc
        run: |
          python - <<'PY'
          import html, json, os, re, tempfile, urllib.parse
          from pathlib import Path
          from curl_cffi import requests
          import tiktok_engine_app as t

          url=os.environ['TEST_URL']
          api='https://tikdownloader.io/api/ajaxSearch'
          headers={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept':'application/json, text/javascript, */*; q=0.01',
              'Accept-Language':'en-US,en;q=0.9',
              'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
              'Origin':'https://tikdownloader.io',
              'Referer':'https://tikdownloader.io/en',
              'X-Requested-With':'XMLHttpRequest',
          }
          s=requests.Session(impersonate='chrome')
          r=s.post(api,data={'q':url,'lang':'en'},headers=headers,timeout=35)
          print('api_status=',r.status_code,'content_type=',r.headers.get('content-type'),'bytes=',len(r.content))
          print('api_head=',r.text[:300].replace('\n',' '))
          r.raise_for_status()
          payload=r.json()
          fragment=str(payload.get('data') or '')
          print('html_bytes=',len(fragment))
          assert fragment,'TikDownloader.io returned empty data'

          # Extract every anchor and nearby text; we verify actual files with ffprobe.
          links=[]
          for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',fragment,re.I|re.S):
              attrs,body=m.group(1),m.group(2)
              hm=re.search(r'\bhref=["\']([^"\']+)',attrs,re.I)
              if not hm: continue
              href=html.unescape(hm.group(1)).strip()
              text=html.unescape(re.sub(r'<[^>]+>',' ',body))
              text=re.sub(r'\s+',' ',text).strip()
              if href.startswith('//'): href='https:'+href
              elif href.startswith('/'): href=urllib.parse.urljoin('https://tikdownloader.io/',href)
              if href.startswith('http'):
                  links.append((href,text))
          # De-duplicate while preserving HTML order.
          seen=set(); uniq=[]
          for href,text in links:
              if href in seen: continue
              seen.add(href); uniq.append((href,text))
          print('anchors=',len(uniq))
          for i,(href,text) in enumerate(uniq):
              print('anchor',i,json.dumps({'text':text,'host':urllib.parse.urlparse(href).hostname,'url':href[:350]},ensure_ascii=False))

          video_links=[x for x in uniq if any(k in x[1].lower() for k in ('mp4','video','hd','download'))]
          if not video_links: video_links=uniq
          assert video_links,'no candidate links found'

          results=[]
          dl_headers={'User-Agent':headers['User-Agent'],'Referer':'https://tikdownloader.io/en','Accept':'*/*'}
          for i,(href,label) in enumerate(video_links[:10]):
              try:
                  rr=s.get(href,headers=dl_headers,allow_redirects=True,timeout=60)
                  print('candidate_http',i,rr.status_code,len(rr.content),rr.headers.get('content-type'),urllib.parse.urlparse(rr.url).hostname,label)
                  if rr.status_code!=200 or len(rr.content)<100000: continue
                  with tempfile.NamedTemporaryFile(suffix='.mp4',delete=False) as f:
                      f.write(rr.content); p=Path(f.name)
                  probe=t._probe(p)
                  p.unlink(missing_ok=True)
                  row={'index':i,'label':label,'bytes':len(rr.content),'final_url':rr.url,'probe':probe}
                  results.append(row)
                  print('CANDIDATE_PROBE=',json.dumps(row,ensure_ascii=False))
              except Exception as e:
                  print('candidate_failed',i,type(e).__name__,str(e)[-300:])

          assert results,'no downloadable TikDownloader.io video candidate'
          def rank(x):
              v=(x.get('probe') or {}).get('video') or {}
              w,h=v.get('width') or 0,v.get('height') or 0
              return (min(w,h),v.get('fps') or 0,(x.get('probe') or {}).get('bit_rate') or 0,x.get('bytes') or 0)
          winner=max(results,key=rank)
          print('BEST_TIKDOWNLOADER_SOURCE=',json.dumps(winner,ensure_ascii=False))
          PY
