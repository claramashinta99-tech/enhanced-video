name: TikTok source probe

on:
  push:
    branches: [main]
    paths:
      - backend/tiktok_engine_app.py
      - .github/workflows/tiktok-source-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ffmpeg and backend dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r backend/requirements.txt
      - name: Test production HD resolver implementation
        working-directory: backend
        env:
          TEST_URL: https://www.tiktok.com/@azzorml13/video/7682277583664336136?is_from_webapp=1&sender_device=pc
        run: |
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          import tiktok_engine_app as t

          assert t.legacy.APP_VERSION == '1.18.0', t.legacy.APP_VERSION
          url=os.environ['TEST_URL']
          with tempfile.TemporaryDirectory() as d:
              path=t._download_tikdownloader_hd(url, Path(d))
              probe=t._probe(path)
              video=probe.get('video') or {}
              print('backend_hd_file=',path.name)
              print('backend_hd_probe=',json.dumps(probe,ensure_ascii=False))
              assert path.name.endswith('_hd.mp4')
              assert probe.get('has_audio') is True
              assert min(video.get('width') or 0,video.get('height') or 0) >= 1080, video
              assert (video.get('fps') or 0) >= 50, video
              assert (probe.get('bit_rate') or 0) >= 10_000_000, probe
              assert path.stat().st_size >= 50_000_000, path.stat().st_size
          PY
