<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="YouTube MP3 Downloader — RVL.">
  <title>YouTube MP3 Downloader — RVL</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    html{background:#0b1020}
    body{background:#0b1020!important;min-height:100vh;position:relative;isolation:isolate;overflow-x:hidden}
    body:before{display:none!important}
    .mp3-pixel-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
      radial-gradient(circle at 16% 12%,rgba(170,140,255,.20),transparent 28%),
      radial-gradient(circle at 84% 18%,rgba(110,216,255,.16),transparent 27%),
      radial-gradient(circle at 50% 92%,rgba(255,145,200,.12),transparent 30%),
      linear-gradient(rgba(110,216,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(110,216,255,.04) 1px,transparent 1px),
      linear-gradient(180deg,#0b1020,#10172b 48%,#0b1020);
      background-size:auto,auto,auto,24px 24px,24px 24px,auto}
    .mp3-pixel-bg:before,.mp3-pixel-bg:after{content:"";position:absolute;width:4px;height:4px;background:#ffd977;box-shadow:
      8vw 13vh 0 #6ed8ff,19vw 31vh 0 #ff91c8,31vw 17vh 0 #ffd977,43vw 39vh 0 #6ed8ff,57vw 14vh 0 #aa8cff,68vw 34vh 0 #ffd977,82vw 22vh 0 #6ed8ff,91vw 44vh 0 #ff91c8,
      12vw 68vh 0 #aa8cff,27vw 78vh 0 #6ed8ff,46vw 71vh 0 #ffd977,64vw 82vh 0 #ff91c8,79vw 65vh 0 #6ed8ff,93vw 76vh 0 #aa8cff;opacity:.48}
    .mp3-pixel-bg:after{left:4px;top:4px;opacity:.20;filter:blur(.2px)}
    body[data-platform="youtube-mp3"]>.shell{position:relative;z-index:1;overflow:visible!important;padding-top:14px}
    body[data-platform="youtube-mp3"] .nav{min-height:78px!important;height:78px!important;box-sizing:border-box!important;overflow:visible!important;background:rgba(18,26,48,.82)!important;border:2px solid #35446a!important;border-radius:4px!important;box-shadow:0 6px 0 #070a14!important;backdrop-filter:blur(10px)}
    .nav-right{display:flex!important;align-items:center!important;gap:10px!important;overflow:visible!important}
    .brand,.nav-right>*{flex-shrink:0}
    .downloader-head h1{color:#fff!important;text-shadow:3px 3px 0 #201842,6px 6px 0 rgba(170,140,255,.14)!important}
    .eyebrow{background:#151d34!important;border-color:#35446a!important;color:#6ed8ff!important;box-shadow:3px 3px 0 #070a14!important}
    .download-card{background:#151d34!important;border:3px solid #35446a!important;box-shadow:7px 7px 0 #070a14!important}
    .download-input,.audio-mode{background:#0c1224!important;border-color:#263453!important;color:#fff!important}
    .btn.primary{background:linear-gradient(#cbbcff,#aa8cff)!important;color:#101426!important;border-color:#101426!important;box-shadow:4px 4px 0 #070a14!important}
    .text-link{color:#6ed8ff!important}
    @media(max-width:700px){.mp3-pixel-bg{background-size:auto,auto,auto,20px 20px,20px 20px,auto}.download-card{border-width:2px!important}body[data-platform="youtube-mp3"]>.shell{padding-top:10px}.nav{min-height:70px!important;height:70px!important}.nav-right{gap:6px!important}.nav-link{display:none!important}}
  </style>
  <script defer src="../assets/mp3.js?v=11"></script>
  <script defer src="../assets/tools-menu.js?v=1"></script>
</head>
<body data-platform="youtube-mp3">
  <div class="mp3-pixel-bg" aria-hidden="true"></div>
  <div class="shell">
    <nav class="nav"><a class="brand" href="../"><span class="brand-mark"></span><span>RVL</span></a><div class="nav-right"><a class="nav-link" href="../">Homepage</a><div class="lang"><button type="button" data-lang="id" class="active">ID</button><button type="button" data-lang="en">EN</button></div></div></nav>
    <main class="downloader-page">
      <div class="downloader-wrap">
        <div class="downloader-head"><span class="eyebrow"><i class="eyebrow-dot"></i>YOUTUBE AUDIO</span><h1>YouTube MP3 Downloader</h1><p id="page-sub">Tempel link YouTube, cek audionya, lalu pilih Audio Asli atau MP3 192 kbps.</p></div>
        <div class="download-card">
          <div class="download-input-wrap"><input id="media-url" class="download-input" type="url" inputmode="url" autocomplete="off" placeholder="Tempel link YouTube" aria-label="YouTube URL"><button id="inspect-btn" class="btn primary large" type="button">Cek</button></div>
          <div id="download-status" class="download-status-text"></div>
          <div id="media-card" class="media-card"><img id="media-thumb" class="media-thumb" alt="Media thumbnail"><div class="media-info"><div id="media-title" class="media-title">—</div><div id="media-meta" class="media-meta"></div><div class="media-actions"><select id="audio-mode" class="audio-mode" aria-label="Format audio"><option value="fast">Audio Asli</option><option value="mp3" selected>MP3 · 192 kbps</option></select><button id="download-btn" class="btn primary" type="button" disabled>Download MP3</button></div></div></div>
        </div>
        <div class="back-row"><a class="text-link" href="../">← Balik ke RVL</a></div>
      </div>
    </main>
  </div>
</body>
</html>
