<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="YouTube MP3 Downloader — RVL.">
  <title>YouTube MP3 Downloader — RVL</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body[data-platform="youtube-mp3"] .nav-right{gap:10px}
    .mp3-music{height:34px;width:34px;min-width:34px;padding:0;border:1px solid #303030;border-radius:9px;background:#121212;color:#d8d8d8;font:700 18px/1 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box}
    .mp3-music.off{color:#666}.mp3-music:hover{background:#1a1a1a;border-color:#464646;color:#fff}
    @media(max-width:700px){.mp3-music{height:32px;width:32px;min-width:32px;padding:0;font-size:17px}}
  </style>
  <script defer src="../assets/mp3.js?v=12"></script>
</head>
<body data-platform="youtube-mp3">
  <audio id="mp3-bgm" src="../assets/site-bgm.mp3" preload="metadata" loop></audio>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="../"><span class="brand-mark"></span><span>RVL</span></a>
      <div class="nav-right">
        <button id="mp3-music" class="mp3-music" type="button" aria-label="Toggle background music" title="Music">♫</button>
        <div class="lang"><button type="button" data-lang="id" class="active">ID</button><button type="button" data-lang="en">EN</button></div>
      </div>
    </nav>
    <main class="downloader-page">
      <div class="downloader-wrap">
        <div class="downloader-head"><span class="eyebrow"><i class="eyebrow-dot"></i>YOUTUBE AUDIO</span><h1>YouTube MP3 Downloader</h1><p id="page-sub">Tempel link YouTube, cek audionya, lalu pilih Audio Asli atau MP3 192 kbps.</p></div>
        <div class="download-card">
          <div class="download-input-wrap"><input id="media-url" class="download-input" type="url" inputmode="url" autocomplete="off" placeholder="Tempel link YouTube" aria-label="YouTube URL"><button id="inspect-btn" class="btn primary large" type="button">Cek</button></div>
          <div id="download-status" class="download-status-text"></div>
          <div id="media-card" class="media-card"><img id="media-thumb" class="media-thumb" alt="Media thumbnail"><div class="media-info"><div id="media-title" class="media-title">—</div><div id="media-meta" class="media-meta"></div><div class="media-actions"><select id="audio-mode" class="audio-mode" aria-label="Format audio"><option value="fast">Audio Asli</option><option value="mp3" selected>MP3 · 192 kbps</option></select><button id="download-btn" class="btn primary" type="button" disabled>Download MP3</button></div></div></div>
        </div>
        <div class="back-row"><a class="text-link" href="../">← Balik ke RVL</a></div>
      </div>
    </main>
  </div>
  <script>
    (()=>{const a=document.getElementById('mp3-bgm'),b=document.getElementById('mp3-music');a.volume=.16;let on=localStorage.getItem('rvl-bgm-enabled')!=='0';const sync=()=>b.classList.toggle('off',!on);const play=()=>{if(on)a.play().catch(()=>{})};sync();const t=Number(sessionStorage.getItem('rvl-bgm-time')||0);a.addEventListener('loadedmetadata',()=>{if(Number.isFinite(t)&&t>0&&a.duration)a.currentTime=t%a.duration},{once:true});const first=()=>{play();window.removeEventListener('pointerdown',first,true);window.removeEventListener('keydown',first,true)};window.addEventListener('pointerdown',first,true);window.addEventListener('keydown',first,true);b.addEventListener('click',()=>{on=!on;localStorage.setItem('rvl-bgm-enabled',on?'1':'0');sync();if(on)play();else a.pause()});window.addEventListener('beforeunload',()=>{if(Number.isFinite(a.currentTime))sessionStorage.setItem('rvl-bgm-time',String(a.currentTime))});})();
  </script>
</body>
</html>
