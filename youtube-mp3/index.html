<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="YouTube MP3 Downloader — RVL.">
  <title>YouTube MP3 Downloader — RVL</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script defer src="../assets/common.js?v=20260916"></script>
  <script defer src="../assets/ambient.js?v=1"></script>
  <script defer src="../assets/router.js?v=3"></script>
  <script defer src="../assets/mp3.js?v=2"></script>
</head>
<body data-platform="youtube-mp3">
  <div class="shell">
    <nav class="nav"><a class="brand" href="../"><span class="brand-mark"></span><span>RVL</span></a><div class="nav-right"><a class="nav-link" href="../" data-i18n="home">Homepage</a><div class="lang"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div></div></nav>

    <main class="downloader-page">
      <div class="downloader-wrap">
        <div class="downloader-head">
          <span class="eyebrow"><i class="eyebrow-dot"></i>YOUTUBE AUDIO</span>
          <h1>YouTube MP3 Downloader</h1>
          <p id="page-sub">Tempel link YouTube, lalu pilih audio cepat atau MP3.</p>
        </div>

        <div class="download-card">
          <div class="download-input-wrap">
            <input id="media-url" class="download-input" type="url" inputmode="url" autocomplete="off" placeholder="Tempel link YouTube" aria-label="YouTube URL">
            <button id="inspect-btn" class="btn primary large" type="button">Cek</button>
          </div>
          <div id="download-status" class="download-status-text"></div>

          <div id="media-card" class="media-card">
            <img id="media-thumb" class="media-thumb" alt="Media thumbnail">
            <div class="media-info">
              <div id="media-title" class="media-title">—</div>
              <div id="media-meta" class="media-meta"></div>
              <div class="media-actions">
                <select id="audio-mode" class="audio-mode" aria-label="Format audio">
                  <option value="fast" selected>Audio cepat · tanpa convert</option>
                  <option value="mp3">MP3 · 192 kbps</option>
                </select>
                <button id="download-btn" class="btn primary" type="button" disabled>Download Audio</button>
              </div>
            </div>
          </div>
        </div>

        <div class="back-row"><a class="text-link" href="../">← <span data-i18n="back">Balik ke RVL</span></a></div>
      </div>
    </main>
  </div>
</body>
</html>
