<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="TikTok Downloader — Reyval.">
  <title>TikTok Downloader — Reyval</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script defer src="../assets/common.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="nav"><a class="brand" href="../"><span class="brand-mark"></span><span>reyval</span></a><div class="nav-right"><a class="nav-link" href="../" data-i18n="home">Homepage</a><div class="lang"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div></div></nav>

    <main class="downloader-page">
      <div class="downloader-wrap">
        <div class="downloader-head">
          <span class="eyebrow"><i class="eyebrow-dot"></i>TIKTOK DOWNLOADER</span>
          <h1>TikTok Downloader</h1>
          <p data-i18n="tiktokPageSub">Simpan video TikTok langsung dari link.</p>
        </div>

        <div class="download-card">
          <div class="download-input-wrap">
            <input class="download-input" type="url" disabled data-i18n-placeholder="pasteTikTok" placeholder="Tempel link TikTok" aria-label="TikTok URL">
            <button class="btn primary large" type="button" disabled data-i18n="download">Download</button>
          </div>
          <div class="download-status"><strong data-i18n="comingShort">Segera hadir</strong><span data-i18n="comingNote">Belum tersedia. Lagi disiapin.</span></div>
        </div>

        <div class="back-row"><a class="text-link" href="../">← <span data-i18n="back">Balik ke Reyval</span></a></div>
      </div>
    </main>
  </div>
</body>
</html>
